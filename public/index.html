<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Virtual Tabletop Simulator - Flying Cards</title>
  <style>
    * {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #ui-container {
      position: absolute;
      top: 12px; left: 12px; right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .btn-group { display: flex; gap: 6px; pointer-events: auto; }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      cursor: pointer;
    }
    #menu-btn { background: #8b5cf6; }
    #reset-btn { background: #dc2626; }
    #dice-btn { background: #f59e0b; }
    #mode-btn.camera-mode { background: #059669; }

    /* 게임 모달 메뉴 */
    #game-menu-modal {
      display: none;
      position: absolute;
      top: 60px; left: 12px;
      background: rgba(24, 24, 27, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      width: 220px;
    }
    #game-menu-modal h3 { color: white; margin: 0 0 12px 0; font-size: 15px; text-align: center; }
    .menu-item {
      display: block; width: 100%; padding: 12px; margin-bottom: 8px;
      background: #27272a; color: white; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600; text-align: left; cursor: pointer;
    }

    #help-panel {
      position: absolute;
      bottom: 12px; left: 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white; padding: 10px 16px; border-radius: 12px;
      font-size: 12px; pointer-events: none; z-index: 10;
      backdrop-filter: blur(4px); line-height: 1.4;
    }
    #help-panel b { color: #38bdf8; }

    #toast {
      position: absolute; top: 110px; left: 50%;
      transform: translateX(-50%); background: #10b981; color: white;
      padding: 10px 20px; border-radius: 25px; font-weight: bold; display: none; z-index: 100;
    }
  </style>
</head>
<body>
  <div id="ui-container">
    <div class="btn-group">
      <button id="menu-btn" class="btn">🎮 게임 선택</button>
      <button id="reset-btn" class="btn">판 초기화</button>
      <button id="dice-btn" class="btn">🎲 주사위 굴리기</button>
    </div>
    <button id="mode-btn" class="btn">카메라 회전 모드</button>
  </div>

  <div id="help-panel">
    🖱️ <b>드래그:</b> 3D 카드/기물 들림 및 관성 틸트 이동<br>
    👆 <b>더블 터치 / 더블 클릭:</b> 카드를 공중에서 3D Flip 뒤집기
  </div>

  <div id="toast"></div>

  <div id="game-menu-modal">
    <h3>보드게임 목록</h3>
    <button class="menu-item" onclick="selectGame('classic')">♟️ 클래식 & 플라잉 카드</button>
    <button class="menu-item" onclick="selectGame('jenga')">🪵 3D 젠가 (Jenga)</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const socket = io();

    // ===== 1. Three.js 설정 =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 11, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableRotate = false;

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 메인 테이블
    const tableMesh = new THREE.Mesh(
      new THREE.BoxGeometry(14, 0.4, 14),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 })
    );
    tableMesh.position.y = -0.2;
    tableMesh.receiveShadow = true;
    scene.add(tableMesh);

    // ===== 2. Cannon.js 물리 엔진 =====
    const world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);

    const jengaMaterial = new CANNON.Material('jengaMat');
    world.addContactMaterial(new CANNON.ContactMaterial(jengaMaterial, jengaMaterial, { friction: 0.3, restitution: 0.2 }));

    const tableBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(7, 0.2, 7)), material: jengaMaterial });
    tableBody.position.set(0, -0.2, 0);
    world.addBody(tableBody);

    // ===== 3. 플라잉 카드 물리 제어 클래스 =====
    class FlyingCardPhysics {
      constructor(mesh, id) {
        this.mesh = mesh;
        this.id = id;
        this.isDragging = false;

        this.pos = new THREE.Vector3(mesh.position.x, mesh.position.y, mesh.position.z);
        this.velocity = new THREE.Vector2(0, 0);

        this.baseRotY = 0;
        this.tiltRot = new THREE.Euler(0, 0, 0);

        this.targetY = 0.05;
        this.isFlying = false;
        this.flyProgress = 0;
        this.flyDuration = 0.4;
        this.startPos = new THREE.Vector3();
        this.targetPos = new THREE.Vector3();

        this.isFlipping = false;
        this.flipProgress = 0;
        this.flipDuration = 0.4;
        this.startRotY = 0;
        this.targetRotY = 0;
      }

      onDragStart() {
        this.isDragging = true;
        this.isFlying = false;
        this.targetY = 0.8; // 드래그 시 Y축(높이) 상승
      }

      onDragMove(targetWorldPos) {
        if (!this.isDragging) return;

        this.velocity.x = targetWorldPos.x - this.pos.x;
        this.velocity.z = targetWorldPos.z - this.pos.z;

        this.pos.x = targetWorldPos.x;
        this.pos.z = targetWorldPos.z;
      }

      onDragEnd() {
        if (!this.isDragging) return;
        this.isDragging = false;
        this.isFlying = true;
        this.flyProgress = 0;

        this.startPos.copy(this.pos);
        const throwX = THREE.MathUtils.clamp(this.pos.x + this.velocity.x * 2.0, -6, 6);
        const throwZ = THREE.MathUtils.clamp(this.pos.z + this.velocity.z * 2.0, -6, 6);
        this.targetPos.set(throwX, 0.05, throwZ);
      }

      flip() {
        if (this.isFlipping) return;
        this.isFlipping = true;
        this.flipProgress = 0;
        this.startRotY = this.baseRotY;
        this.targetRotY = this.baseRotY + Math.PI;

        if (!this.isDragging && !this.isFlying) {
          this.isFlying = true;
          this.flyProgress = 0;
          this.startPos.copy(this.pos);
          this.targetPos.copy(this.pos);
        }
      }

      update(delta) {
        // [1] 3D Flip 회전
        if (this.isFlipping) {
          this.flipProgress += delta / this.flipDuration;
          if (this.flipProgress >= 1) {
            this.flipProgress = 1;
            this.isFlipping = false;
            this.baseRotY = this.targetRotY % (Math.PI * 2);
          }
          const t = this.flipProgress;
          const easeT = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
          this.baseRotY = THREE.MathUtils.lerp(this.startRotY, this.targetRotY, easeT);
        }

        // [2] 드래그 높이 & 관성 틸트
        if (this.isDragging) {
          this.pos.y += (this.targetY - this.pos.y) * 0.2;

          const targetTiltX = -this.velocity.z * 0.8;
          const targetTiltZ = -this.velocity.x * 0.8;

          this.tiltRot.x += (targetTiltX - this.tiltRot.x) * 0.2;
          this.tiltRot.z += (targetTiltZ - this.tiltRot.z) * 0.2;

          this.velocity.multiplyScalar(0.7);
        }
        // [3] 포물선 비행 & 착지
        else if (this.isFlying) {
          this.flyProgress += delta / this.flyDuration;
          if (this.flyProgress >= 1) {
            this.flyProgress = 1;
            this.isFlying = false;
          }

          const t = this.flyProgress;
          const easeT = 1 - Math.pow(1 - t, 3);

          this.pos.x = THREE.MathUtils.lerp(this.startPos.x, this.targetPos.x, easeT);
          this.pos.z = THREE.MathUtils.lerp(this.startPos.z, this.targetPos.z, easeT);

          const peakHeight = this.isFlipping ? 1.5 : 0.6;
          const arcHeight = Math.sin(t * Math.PI) * peakHeight;
          this.pos.y = THREE.MathUtils.lerp(this.startPos.y, this.targetPos.y, easeT) + arcHeight;

          this.tiltRot.x += (0 - this.tiltRot.x) * 0.2;
          this.tiltRot.z += (0 - this.tiltRot.z) * 0.2;
        }

        this.mesh.position.copy(this.pos);

        const qBase = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), this.baseRotY);
        const qTilt = new THREE.Quaternion().setFromEuler(this.tiltRot);
        this.mesh.quaternion.copy(qTilt.multiply(qBase));
      }
    }

    // ===== 4. 3D 카드 텍스처 생성기 =====
    function createCardFrontTexture(suit, value, color) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 384;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 256, 384);
      ctx.lineWidth = 10; ctx.strokeStyle = '#cbd5e1'; ctx.strokeRect(5, 5, 246, 374);
      ctx.fillStyle = color; ctx.font = 'bold 44px sans-serif'; ctx.fillText(value, 20, 55);
      ctx.font = 'bold 72px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(suit, 128, 210);
      return new THREE.CanvasTexture(canvas);
    }

    function createCardBackTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 384;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#b91c1c'; ctx.fillRect(0, 0, 256, 384);
      ctx.lineWidth = 8; ctx.strokeStyle = '#ffffff'; ctx.strokeRect(8, 8, 240, 368);
      ctx.fillStyle = '#991b1b';
      for(let i=20; i<240; i+=20) {
        for(let j=20; j<360; j+=20) ctx.fillRect(i, j, 10, 10);
      }
      return new THREE.CanvasTexture(canvas);
    }

    // ===== 5. 기물 및 플라잉 카드 생성 =====
    let currentGame = 'classic';
    const objects = {};
    const flyingCards = {};

    const jengaGeo = new THREE.BoxGeometry(3, 0.6, 1);
    const jengaShape = new CANNON.Box(new CANNON.Vec3(1.48, 0.29, 0.48));
    const cardGeo = new THREE.BoxGeometry(1.6, 0.02, 2.4);

    function clearAll() {
      Object.keys(objects).forEach(id => {
        scene.remove(objects[id].mesh);
        if (objects[id].body) world.remove(objects[id].body);
        delete objects[id];
      });
      Object.keys(flyingCards).forEach(id => {
        scene.remove(flyingCards[id].mesh);
        delete flyingCards[id];
      });
    }

    function createPiece(data) {
      if (data.type === 'flying_card') {
        const mat = [
          new THREE.MeshStandardMaterial({ color: 0xcccccc }),
          new THREE.MeshStandardMaterial({ color: 0xcccccc }),
          new THREE.MeshStandardMaterial({ color: 0xcccccc }),
          new THREE.MeshStandardMaterial({ color: 0xcccccc }),
          new THREE.MeshStandardMaterial({ map: createCardFrontTexture(data.suit, data.value, data.color), roughness: 0.3 }),
          new THREE.MeshStandardMaterial({ map: createCardBackTexture(), roughness: 0.3 })
        ];
        const mesh = new THREE.Mesh(cardGeo, mat);
        mesh.position.set(data.x, data.y, data.z);
        mesh.castShadow = true;
        mesh.userData = { id: data.id, type: 'flying_card' };
        scene.add(mesh);

        flyingCards[data.id] = new FlyingCardPhysics(mesh, data.id);
        return;
      }

      let mesh, body;
      if (data.type === 'jenga_block') {
        mesh = new THREE.Mesh(jengaGeo, new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.3 }));
        body = new CANNON.Body({ mass: 0.3, shape: jengaShape, material: jengaMaterial });
        body.position.set(data.x, data.y, data.z);
        body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), data.rotY);
      } else if (data.type === 'dice') {
        mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: data.color }));
        body = new CANNON.Body({ mass: 0.5, shape: new CANNON.Box(new CANNON.Vec3(0.5, 0.5, 0.5)) });
        body.position.set(data.x, data.y, data.z);
      } else if (data.type === 'figure') {
        const group = new THREE.Group();
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 0.3, 16), new THREE.MeshStandardMaterial({ color: data.color }));
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), new THREE.MeshStandardMaterial({ color: data.color }));
        head.position.y = 0.5;
        group.add(base); group.add(head);
        mesh = group;

        body = new CANNON.Body({ mass: 0.4, shape: new CANNON.Cylinder(0.5, 0.6, 0.8, 16) });
        body.position.set(data.x, data.y, data.z);
      } else {
        mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.2, 32), new THREE.MeshStandardMaterial({ color: data.color }));
        body = new CANNON.Body({ mass: 0.2, shape: new CANNON.Cylinder(0.5, 0.5, 0.2, 16) });
        body.position.set(data.x, data.y, data.z);
      }

      mesh.castShadow = true;
      mesh.userData = { id: data.id, type: data.type };
      scene.add(mesh);
      world.addBody(body);
      objects[data.id] = { mesh, body };
    }

    // ===== 6. 소켓 실시간 이벤트 =====
    socket.on('init-game-mode', (data) => {
      currentGame = data.game;
      clearAll();
    });

    socket.on('init-physics-objects', (data) => {
      clearAll();
      Object.values(data).forEach(createPiece);
    });

    socket.on('update-object', (data) => {
      if (flyingCards[data.id]) {
        const card = flyingCards[data.id];
        if (!card.isDragging) {
          card.pos.set(data.x, data.y, data.z);
        }
      } else if (objects[data.id] && objects[data.id].body) {
        const b = objects[data.id].body;
        b.position.set(data.x, data.y, data.z);
        if (data.qx !== undefined) b.quaternion.set(data.qx, data.qy, data.qz, data.qw);
      }
    });

    socket.on('roll-dice-action', () => {
      Object.values(objects).forEach(obj => {
        if (obj.mesh.userData.type === 'dice') {
          obj.body.velocity.set((Math.random() - 0.5) * 8, 7 + Math.random() * 5, (Math.random() - 0.5) * 8);
          obj.body.angularVelocity.set(Math.random() * 12, Math.random() * 12, Math.random() * 12);
        }
      });
      showToast('🎲 주사위를 던졌습니다!');
    });

    socket.on('flip-card-action', (data) => {
      if (flyingCards[data.id]) {
        flyingCards[data.id].flip();
      }
    });

    // ===== 7. 모바일 터치 / 마우스 Raycasting 컨트롤 =====
    const raycaster = new THREE.Raycaster();
    const touchPos = new THREE.Vector2();
    let lastTouchPos = new THREE.Vector2();
    let selectedObject = null;
    let selectedCard = null;

    let lastTapTime = 0;

    function updateTouchPos(e) {
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      touchPos.x = (x / window.innerWidth) * 2 - 1;
      touchPos.y = -(y / window.innerHeight) * 2 + 1;
    }

    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const planeIntersection = new THREE.Vector3();

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#ui-container') || e.target.closest('#game-menu-modal')) return;
      updateTouchPos(e);
      lastTouchPos.copy(touchPos);

      raycaster.setFromCamera(touchPos, camera);

      // 1) 플라잉 카드 클릭 검사
      const cardMeshes = Object.values(flyingCards).map(c => c.mesh);
      const cardIntersects = raycaster.intersectObjects(cardMeshes);

      if (cardIntersects.length > 0) {
        const cardId = cardIntersects[0].object.userData.id;
        const card = flyingCards[cardId];

        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTapTime;

        // 더블 클릭/터치 감지 -> 3D Flip
        if (tapLength < 300 && tapLength > 0) {
          socket.emit('flip-card', cardId);
        } else {
          selectedCard = card;
          selectedCard.onDragStart();
        }
        lastTapTime = currentTime;
        return;
      }

      // 2) 일반 물리 기물 클릭 검사
      if (isCameraMode) return;
      const meshes = Object.values(objects).map(o => o.mesh);
      const intersects = raycaster.intersectObjects(meshes);

      if (intersects.length > 0) {
        selectedObject = objects[intersects[0].object.userData.id || intersects[0].object.parent.userData.id];
      }
    });

    window.addEventListener('pointermove', (e) => {
      updateTouchPos(e);
      raycaster.setFromCamera(touchPos, camera);

      // 플라잉 카드 드래그 이동
      if (selectedCard) {
        if (raycaster.ray.intersectPlane(dragPlane, planeIntersection)) {
          selectedCard.onDragMove(planeIntersection);
          socket.emit('move-object', {
            id: selectedCard.id,
            x: selectedCard.pos.x, y: selectedCard.pos.y, z: selectedCard.pos.z
          });
        }
        return;
      }

      // 물리 기물 임펄스 이동
      if (selectedObject && !isCameraMode) {
        if (selectedObject.body) {
          const dx = (touchPos.x - lastTouchPos.x) * 12;
          const dy = (touchPos.y - lastTouchPos.y) * 12;
          selectedObject.body.applyImpulse(new CANNON.Vec3(dx, 0, -dy), selectedObject.body.position);

          const b = selectedObject.body;
          socket.emit('move-object', {
            id: selectedObject.mesh.userData.id,
            x: b.position.x, y: b.position.y, z: b.position.z,
            qx: b.quaternion.x, qy: b.quaternion.y, qz: b.quaternion.z, qw: b.quaternion.w
          });
        }
      }
      lastTouchPos.copy(touchPos);
    });

    window.addEventListener('pointerup', () => {
      if (selectedCard) {
        selectedCard.onDragEnd();
        socket.emit('move-object', {
          id: selectedCard.id,
          x: selectedCard.pos.x, y: selectedCard.pos.y, z: selectedCard.pos.z
        });
        selectedCard = null;
      }
      selectedObject = null;
    });

    // UI 버튼
    let isCameraMode = false;
    document.getElementById('menu-btn').addEventListener('click', () => {
      const modal = document.getElementById('game-menu-modal');
      modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    });

    function selectGame(gameType) {
      socket.emit('change-game', gameType);
      document.getElementById('game-menu-modal').style.display = 'none';
    }

    document.getElementById('reset-btn').addEventListener('click', () => socket.emit('reset-game'));
    document.getElementById('dice-btn').addEventListener('click', () => socket.emit('roll-dice'));

    const modeBtn = document.getElementById('mode-btn');
    modeBtn.addEventListener('click', () => {
      isCameraMode = !isCameraMode;
      controls.enableRotate = isCameraMode;
      modeBtn.textContent = isCameraMode ? "물체 이동 모드" : "카메라 회전 모드";
      if (isCameraMode) modeBtn.classList.add('camera-mode');
      else modeBtn.classList.remove('camera-mode');
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg; toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    // 메인 루프
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      world.step(1 / 60);

      // 기물 메쉬 매핑
      Object.values(objects).forEach(obj => {
        if (obj.body) {
          obj.mesh.position.copy(obj.body.position);
          obj.mesh.quaternion.copy(obj.body.quaternion);
        }
      });

      // 플라잉 카드 물리/Flip 업데이트
      Object.values(flyingCards).forEach(card => card.update(delta));

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
