<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>멀티 보드게임 시뮬레이터</title>
  <style>
    * {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #ui-container {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .btn {
      pointer-events: auto;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      cursor: pointer;
      margin-right: 4px;
    }
    #menu-btn { background: #8b5cf6; }
    #reset-btn { background: #dc2626; }
    #mode-btn.camera-mode { background: #059669; }
    #onecard-btn { background: #eab308; color: #000; display: none; }

    /* 게임 선택 드롭다운 모달 */
    #game-menu-modal {
      display: none;
      position: absolute;
      top: 60px;
      left: 12px;
      background: rgba(24, 24, 27, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      width: 220px;
    }
    #game-menu-modal h3 {
      color: white;
      margin: 0 0 12px 0;
      font-size: 15px;
      text-align: center;
    }
    .menu-item {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      background: #27272a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .menu-item:hover, .menu-item:active { background: #3f3f46; }

    /* 원카드 전용 UI */
    #status-bar {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      z-index: 10;
      display: none;
    }
    #hand-container {
      position: absolute;
      bottom: 12px;
      left: 0; right: 0;
      height: 120px;
      display: none;
      justify-content: center;
      align-items: flex-end;
      padding: 0 10px;
      z-index: 20;
      overflow-x: auto;
    }
    .card-ui {
      width: 65px; height: 95px;
      background: white;
      border-radius: 8px;
      margin: 0 -10px;
      box-shadow: -2px 0 8px rgba(0,0,0,0.4);
      display: flex; flex-direction: column;
      justify-content: space-between;
      padding: 6px; font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
      border: 2px solid #cbd5e1;
    }
    .card-ui:active { transform: translateY(-15px); }
    .card-ui .card-value { font-size: 16px; }
    .card-ui .card-suit { font-size: 22px; text-align: center; }

    #toast {
      position: absolute;
      top: 110px; left: 50%;
      transform: translateX(-50%);
      background: #ef4444; color: white;
      padding: 10px 20px; border-radius: 25px;
      font-weight: bold; display: none; z-index: 100;
    }
  </style>
</head>
<body>
  <div id="ui-container">
    <div>
      <button id="menu-btn" class="btn">🎮 게임 선택</button>
      <button id="reset-btn" class="btn">판 초기화</button>
    </div>
    <button id="mode-btn" class="btn">카메라 회전 모드</button>
    <button id="onecard-btn" class="btn">🔥 ONE CARD!</button>
  </div>

  <div id="status-bar">대기 중...</div>
  <div id="toast"></div>

  <div id="game-menu-modal">
    <h3>보드게임 목록</h3>
    <button class="menu-item" onclick="selectGame('onecard')">🃏 원카드 (One Card)</button>
    <button class="menu-item" onclick="selectGame('jenga')">🪵 3D 젠가 (Jenga)</button>
    <button class="menu-item" onclick="selectGame('classic')">♟️ 클래식 체크보드</button>
  </div>

  <div id="hand-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const socket = io();

    // ===== 1. Three.js 기본 설정 =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 11, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableRotate = false;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 바닥 테이블
    const tableGeo = new THREE.BoxGeometry(14, 0.4, 14);
    const tableMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
    const tableMesh = new THREE.Mesh(tableGeo, tableMat);
    tableMesh.position.y = -0.2;
    tableMesh.receiveShadow = true;
    scene.add(tableMesh);

    // ===== 2. Cannon.js 물리 세계 설정 (젠가/체크보드용) =====
    const world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);
    world.solver.iterations = 10;

    const jengaMaterial = new CANNON.Material('jengaMat');
    world.addContactMaterial(new CANNON.ContactMaterial(jengaMaterial, jengaMaterial, { friction: 0.3, restitution: 0.0 }));

    const tableBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(7, 0.2, 7)), material: jengaMaterial });
    tableBody.position.set(0, -0.2, 0);
    world.addBody(tableBody);

    // ===== 3. 게임 상태 변수 =====
    let currentGame = 'onecard';
    const objects = {}; // 젠가/체크보드 오브젝트

    const jengaGeo = new THREE.BoxGeometry(3, 0.6, 1);
    const jengaShape = new CANNON.Box(new CANNON.Vec3(1.48, 0.29, 0.48));

    // 원카드 3D 메쉬
    let deckMesh, discardMesh;
    const cardGeo = new THREE.BoxGeometry(1.6, 0.02, 2.4);

    function clearAll() {
      Object.keys(objects).forEach(id => {
        scene.remove(objects[id].mesh);
        if (objects[id].body) world.remove(objects[id].body);
        delete objects[id];
      });
      if (deckMesh) { scene.remove(deckMesh); deckMesh = null; }
      if (discardMesh) { scene.remove(discardMesh); discardMesh = null; }
    }

    // ===== 4. 젠가 및 물리 오브젝트 생성 =====
    function createPiece(data) {
      let mesh, body;
      if (data.type === 'jenga_block') {
        const mat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.3 });
        mesh = new THREE.Mesh(jengaGeo, mat);
        body = new CANNON.Body({ mass: 0.3, shape: jengaShape, material: jengaMaterial, linearDamping: 0.5, angularDamping: 0.5 });
        body.position.set(data.x, data.y, data.z);
        body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), data.rotY);
        world.addBody(body);
      } else {
        let geo = data.type === 'token' ? new THREE.CylinderGeometry(0.6, 0.6, 0.3, 32) : new THREE.BoxGeometry(1, 1, 1);
        const mat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.3 });
        mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(data.x, data.y, data.z);
      }
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData = { id: data.id, type: data.type };
      scene.add(mesh);
      objects[data.id] = { mesh, body };
    }

    // ===== 5. 원카드 3D 카드 텍스처 =====
    function createCardTexture(suit, value, colorStr) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 384;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 256, 384);
      ctx.lineWidth = 8; ctx.strokeStyle = '#cbd5e1'; ctx.strokeRect(4, 4, 248, 376);
      ctx.fillStyle = colorStr; ctx.font = 'bold 48px sans-serif';
      ctx.fillText(value, 20, 60); ctx.fillText(suit, 20, 110);
      ctx.font = 'bold 96px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(suit, 128, 220);
      return new THREE.CanvasTexture(canvas);
    }

    function updateOneCardTable(topCard) {
      if (discardMesh) scene.remove(discardMesh);
      if (deckMesh) scene.remove(deckMesh);

      if (topCard) {
        const texture = createCardTexture(topCard.suit, topCard.value, topCard.color);
        discardMesh = new THREE.Mesh(cardGeo, new THREE.MeshStandardMaterial({ map: texture }));
        discardMesh.position.set(0.9, 0.05, 0);
        scene.add(discardMesh);
      }

      deckMesh = new THREE.Mesh(cardGeo, new THREE.MeshStandardMaterial({ color: 0x1e3a8a }));
      deckMesh.position.set(-0.9, 0.1, 0);
      scene.add(deckMesh);
    }

    // ===== 6. 소켓 이벤트 수신 =====
    socket.on('init-game-mode', (data) => {
      currentGame = data.game;
      clearAll();

      const statusBar = document.getElementById('status-bar');
      const handContainer = document.getElementById('hand-container');
      const modeBtn = document.getElementById('mode-btn');
      const onecardBtn = document.getElementById('onecard-btn');

      if (currentGame === 'onecard') {
        statusBar.style.display = 'block';
        handContainer.style.display = 'flex';
        onecardBtn.style.display = 'block';
        modeBtn.style.display = 'none';
        camera.position.set(0, 9, 8);
        camera.lookAt(0, 0, 0);
      } else {
        statusBar.style.display = 'none';
        handContainer.style.display = 'none';
        onecardBtn.style.display = 'none';
        modeBtn.style.display = 'block';
        camera.position.set(0, 12, 14);
      }
    });

    socket.on('init-physics-objects', (data) => {
      clearAll();
      Object.values(data).forEach(createPiece);
    });

    socket.on('update-object', (data) => {
      if (objects[data.id]) {
        if (objects[data.id].body) {
          const b = objects[data.id].body;
          b.position.set(data.x, data.y, data.z);
          if (data.qx !== undefined) b.quaternion.set(data.qx, data.qy, data.qz, data.qw);
        } else {
          objects[data.id].mesh.position.set(data.x, data.y, data.z);
        }
      }
    });

    let isMyTurn = false;
    socket.on('update-onecard-state', (data) => {
      if (currentGame !== 'onecard') return;
      isMyTurn = (data.currentTurnSocketId === socket.id);

      const statusBar = document.getElementById('status-bar');
      if (isMyTurn) {
        statusBar.style.background = '#22c55e';
        statusBar.textContent = data.attackStack > 0 ? `⚡ 공격 당함! +${data.attackStack}장 (방어 or 카드 덱 터치)` : `🎯 내 차례입니다! 카드를 내거나 덱을 터치하세요.`;
      } else {
        statusBar.style.background = 'rgba(15, 23, 42, 0.85)';
        statusBar.textContent = `⌛ 다른 플레이어 순서 진행 중...`;
      }

      updateOneCardTable(data.topCard);

      const handContainer = document.getElementById('hand-container');
      handContainer.innerHTML = '';
      data.myHand.forEach(card => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card-ui';
        cardEl.style.color = card.color;
        cardEl.innerHTML = `<div class="card-value">${card.value}</div><div class="card-suit">${card.suit}</div>`;
        cardEl.addEventListener('click', () => {
          if (!isMyTurn) { showToast('내 차례가 아닙니다!'); return; }
          socket.emit('play-card', card.id);
        });
        handContainer.appendChild(cardEl);
      });
    });

    // ===== 7. 인터랙션 및 터치 처리 =====
    const raycaster = new THREE.Raycaster();
    const touchPos = new THREE.Vector2();
    let lastTouchPos = new THREE.Vector2();
    let selectedObject = null;

    function updateTouchPos(e) {
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      touchPos.x = (x / window.innerWidth) * 2 - 1;
      touchPos.y = -(y / window.innerHeight) * 2 + 1;
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#ui-container') || e.target.closest('#game-menu-modal') || e.target.closest('#hand-container')) return;
      updateTouchPos(e);
      lastTouchPos.copy(touchPos);

      raycaster.setFromCamera(touchPos, camera);

      if (currentGame === 'onecard') {
        if (deckMesh && raycaster.intersectObject(deckMesh).length > 0) {
          if (!isMyTurn) { showToast('내 차례가 아닙니다!'); return; }
          socket.emit('draw-card');
        }
      } else {
        if (isCameraMode) return;
        const meshes = Object.values(objects).map(o => o.mesh);
        const intersects = raycaster.intersectObjects(meshes);
        if (intersects.length > 0) {
          selectedObject = objects[intersects[0].object.userData.id];
        }
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!selectedObject || isCameraMode || currentGame === 'onecard') return;
      updateTouchPos(e);

      if (selectedObject.body) {
        const dx = (touchPos.x - lastTouchPos.x) * 12;
        const dy = (touchPos.y - lastTouchPos.y) * 12;
        selectedObject.body.applyImpulse(new CANNON.Vec3(dx, 0, -dy), selectedObject.body.position);

        const b = selectedObject.body;
        socket.emit('move-object', {
          id: selectedObject.mesh.userData.id,
          x: b.position.x, y: b.position.y, z: b.position.z,
          qx: b.quaternion.x, qy: b.quaternion.y, qz: b.quaternion.z, qw: b.quaternion.w
        });
      }
      lastTouchPos.copy(touchPos);
    });

    window.addEventListener('pointerup', () => { selectedObject = null; });

    // UI 이벤트
    let isCameraMode = false;
    document.getElementById('menu-btn').addEventListener('click', () => {
      const modal = document.getElementById('game-menu-modal');
      modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    });

    function selectGame(gameType) {
      socket.emit('change-game', gameType);
      document.getElementById('game-menu-modal').style.display = 'none';
    }

    document.getElementById('reset-btn').addEventListener('click', () => socket.emit('reset-game'));
    document.getElementById('onecard-btn').addEventListener('click', () => socket.emit('shout-onecard'));

    const modeBtn = document.getElementById('mode-btn');
    modeBtn.addEventListener('click', () => {
      isCameraMode = !isCameraMode;
      controls.enableRotate = isCameraMode;
      modeBtn.textContent = isCameraMode ? "물체 이동 모드" : "카메라 회전 모드";
      if (isCameraMode) modeBtn.classList.add('camera-mode');
      else modeBtn.classList.remove('camera-mode');
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg; toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }
    socket.on('toast-message', (d) => showToast(d.text));
    socket.on('game-over', (d) => showToast(d.winner === socket.id ? '🎉 승리했습니다!' : '😭 패배했습니다!'));

    // 애니메이션 룹
    function animate() {
      requestAnimationFrame(animate);
      if (currentGame !== 'onecard') {
        world.step(1 / 60);
        Object.values(objects).forEach(obj => {
          if (obj.body) {
            obj.mesh.position.copy(obj.body.position);
            obj.mesh.quaternion.copy(obj.body.quaternion);
          }
        });
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
