<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 뷰포트 설정 및 제스처 줌 방지 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile Web TTS</title>
  <style>
    * {
      touch-action: none; /* 모바일 브라우저 기본 스크롤/새로고침 제스처 차단 */
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #ui-container {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    #info {
      color: white;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      backdrop-filter: blur(4px);
    }
    #mode-btn {
      pointer-events: auto;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    #mode-btn.camera-mode {
      background: #059669;
    }
  </style>
</head>
<body>
  <div id="ui-container">
    <div id="info">상태: 물체 이동 모드</div>
    <button id="mode-btn">카메라 회전 모드 전환</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const socket = io();

    // 1. Scene & Camera
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 12, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 모바일 해상도 대응 및 성능 최적화
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 2. Controls & Lights
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableRotate = false; // 기본은 물체 드래그 모드로 시작
    controls.enablePan = false;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(5, 15, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 3. Table Board
    const tableGeometry = new THREE.BoxGeometry(12, 0.2, 12);
    const tableMaterial = new THREE.MeshStandardMaterial({ color: 0x1e3a8a });
    const table = new THREE.Mesh(tableGeometry, tableMaterial);
    table.position.y = -0.1;
    table.receiveShadow = true;
    scene.add(table);

    // 4. Object & Interaction Settings
    const objects = {};
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const raycaster = new THREE.Raycaster();
    const touchPos = new THREE.Vector2();
    let selectedObject = null;
    let isCameraMode = false;

    // 모드 전환 버튼 (물체 이동 <-> 카메라 회전)
    const modeBtn = document.getElementById('mode-btn');
    const infoText = document.getElementById('info');

    modeBtn.addEventListener('click', () => {
      isCameraMode = !isCameraMode;
      controls.enableRotate = isCameraMode;
      
      if (isCameraMode) {
        modeBtn.textContent = "물체 이동 모드 전환";
        modeBtn.classList.add('camera-mode');
        infoText.textContent = "상태: 화면 회전 모드";
      } else {
        modeBtn.textContent = "카메라 회전 모드 전환";
        modeBtn.classList.remove('camera-mode');
        infoText.textContent = "상태: 물체 이동 모드";
      }
    });

    function createCube(id, x, y, z, color) {
      const geometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
      const material = new THREE.MeshStandardMaterial({ color: color });
      const cube = new THREE.Mesh(geometry, material);
      cube.position.set(x, y, z);
      cube.castShadow = true;
      cube.userData = { id: id };
      scene.add(cube);
      objects[id] = cube;
    }

    // Socket Events
    socket.on('init-state', (data) => {
      Object.values(data).forEach(obj => {
        if (!objects[obj.id]) createCube(obj.id, obj.x, obj.y, obj.z, obj.color);
      });
    });

    socket.on('update-object', (data) => {
      if (objects[data.id]) {
        objects[data.id].position.x = data.x;
        objects[data.id].position.z = data.z;
      }
    });

    // 5. Mobile Pointer / Touch Events
    function updateTouchPos(e) {
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      touchPos.x = (x / window.innerWidth) * 2 - 1;
      touchPos.y = -(y / window.innerHeight) * 2 + 1;
    }

    window.addEventListener('pointerdown', (e) => {
      if (isCameraMode) return;
      updateTouchPos(e);

      raycaster.setFromCamera(touchPos, camera);
      const intersects = raycaster.intersectObjects(Object.values(objects));

      if (intersects.length > 0) {
        selectedObject = intersects[0].object;
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!selectedObject || isCameraMode) return;
      updateTouchPos(e);

      raycaster.setFromCamera(touchPos, camera);
      const intersectionPoint = new THREE.Vector3();

      if (raycaster.ray.intersectPlane(dragPlane, intersectionPoint)) {
        selectedObject.position.x = intersectionPoint.x;
        selectedObject.position.z = intersectionPoint.z;

        socket.emit('move-object', {
          id: selectedObject.userData.id,
          x: selectedObject.position.x,
          z: selectedObject.position.z
        });
      }
    });

    window.addEventListener('pointerup', () => {
      selectedObject = null;
    });

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
