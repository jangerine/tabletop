<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Tabletop Simulator</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #1a1a1a; }
    #info {
      position: absolute; top: 10px; left: 10px; color: white;
      font-family: sans-serif; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 5px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">
    <h2>Web Tabletop Simulator</h2>
    <p>마우스 드래그: 오브젝트 이동 | 우클릭 드래그: 카메라 회전</p>
  </div>

  <!-- CDN 불러오기 -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const socket = io();

    // 1. Three.js 기본 씬/카메라/렌더러 설정
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 10, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 카메라 조작 (우클릭 이동/회전)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };

    // 조명 추가
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 테이블 판(바닥) 생성
    const tableGeometry = new THREE.BoxGeometry(15, 0.2, 15);
    const tableMaterial = new THREE.MeshStandardMaterial({ color: 0x076324 }); // 초록색 보드
    const table = new THREE.Mesh(tableGeometry, tableMaterial);
    table.position.y = -0.1;
    table.receiveShadow = true;
    scene.add(table);

    // 오브젝트 관리 객체
    const objects = {};
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0); // 이동 평면
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    let selectedObject = null;

    // 큐브 생성 함수
    function createCube(id, x, y, z, color) {
      const geometry = new THREE.BoxGeometry(1, 1, 1);
      const material = new THREE.MeshStandardMaterial({ color: color });
      const cube = new THREE.Mesh(geometry, material);
      cube.position.set(x, y, z);
      cube.castShadow = true;
      cube.userData = { id: id };
      
      scene.add(cube);
      objects[id] = cube;
    }

    // 2. 소켓 이벤트 처리
    socket.on('init-state', (data) => {
      Object.values(data).forEach(obj => {
        if (!objects[obj.id]) {
          createCube(obj.id, obj.x, obj.y, obj.z, obj.color);
        }
      });
    });

    socket.on('update-object', (data) => {
      if (objects[data.id]) {
        objects[data.id].position.x = data.x;
        objects[data.id].position.z = data.z;
      }
    });

    // 3. 마우스 드래그 로직 (좌클릭 이동)
    window.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return; // 좌클릭만 처리

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(Object.values(objects));

      if (intersects.length > 0) {
        selectedObject = intersects[0].object;
        controls.enabled = false; // 드래그 중에는 카메라 회전 비활성화
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!selectedObject) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersectionPoint = new THREE.Vector3();
      
      if (raycaster.ray.intersectPlane(dragPlane, intersectionPoint)) {
        selectedObject.position.x = intersectionPoint.x;
        selectedObject.position.z = intersectionPoint.z;

        // 서버로 이동 위치 전송
        socket.emit('move-object', {
          id: selectedObject.userData.id,
          x: selectedObject.position.x,
          z: selectedObject.position.z
        });
      }
    });

    window.addEventListener('pointerup', () => {
      selectedObject = null;
      controls.enabled = true;
    });

    // 화면 리사이즈
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 렌더링 루프
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
