<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Web Tabletop Simulator</title>
  <style>
    * {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      overflow: hidden;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #ui-container {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    .btn {
      pointer-events: auto;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      cursor: pointer;
      margin-right: 6px;
    }
    #menu-btn { background: #8b5cf6; }
    #reset-btn { background: #dc2626; }
    #mode-btn.camera-mode { background: #059669; }

    #game-menu-modal {
      display: none;
      position: absolute;
      top: 60px;
      left: 12px;
      background: rgba(24, 24, 27, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      width: 200px;
    }
    #game-menu-modal h3 {
      color: white;
      margin: 0 0 12px 0;
      font-size: 15px;
      text-align: center;
    }
    .menu-item {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      background: #27272a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s;
    }
    .menu-item:hover, .menu-item:active {
      background: #3f3f46;
    }
  </style>
</head>
<body>
  <div id="ui-container">
    <div>
      <button id="menu-btn" class="btn">🎮 게임 선택</button>
      <button id="reset-btn" class="btn">판 초기화</button>
    </div>
    <button id="mode-btn" class="btn">카메라 회전 모드</button>
  </div>

  <div id="game-menu-modal">
    <h3>보드게임 목록</h3>
    <button class="menu-item" onclick="selectGame('jenga')">🪵 3D 젠가 (Jenga)</button>
    <button class="menu-item" onclick="selectGame('classic')">♟️ 클래식 체크보드</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const socket = io();

    // 1. Scene 설정
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111625);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 12, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableRotate = false;

    // 2. 물리 세계 설정 (Cannon.js)
    const world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);
    world.solver.iterations = 15; // 물리 반복 계산을 올려 정확도 향상

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 바닥
    const tableGeo = new THREE.BoxGeometry(14, 0.4, 14);
    const tableMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
    const tableMesh = new THREE.Mesh(tableGeo, tableMat);
    tableMesh.position.y = -0.2;
    tableMesh.receiveShadow = true;
    scene.add(tableMesh);

    const tableBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(7, 0.2, 7)) });
    tableBody.position.set(0, -0.2, 0);
    world.addBody(tableBody);

    // 3. 게임 오브젝트 관리
    const objects = {};
    let currentGameType = 'jenga';

    const jengaGeo = new THREE.BoxGeometry(3, 0.6, 1);
    // 물리 히트박스를 아주 살짝 좁혀 연쇄 겹침 충돌 방지
    const jengaShape = new CANNON.Box(new CANNON.Vec3(1.48, 0.29, 0.48));

    function clearScene() {
      Object.keys(objects).forEach(id => {
        scene.remove(objects[id].mesh);
        if (objects[id].body) world.remove(objects[id].body);
        delete objects[id];
      });
    }

    function createPiece(data) {
      let mesh, body;

      if (data.type === 'jenga_block') {
        const mat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.3 });
        mesh = new THREE.Mesh(jengaGeo, mat);
        
        // 무게(mass)를 0.5로 늘리고 linearDamping/angularDamping을 0.8로 올려 흔들림 차단
        body = new CANNON.Body({
          mass: 0.5,
          shape: jengaShape,
          linearDamping: 0.8,
          angularDamping: 0.8
        });
        body.position.set(data.x, data.y, data.z);
        body.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), data.rotY);
        world.addBody(body);
      } else {
        let geo = data.type === 'token' ? new THREE.CylinderGeometry(0.6, 0.6, 0.3, 32) : new THREE.BoxGeometry(1, 1, 1);
        const mat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.3 });
        mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(data.x, data.y, data.z);
      }

      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData = { id: data.id, type: data.type };
      scene.add(mesh);

      objects[data.id] = { mesh, body };
    }

    socket.on('init-game', (data) => {
      clearScene();
      currentGameType = data.game;
      Object.values(data.objects).forEach(createPiece);
    });

    socket.on('update-object', (data) => {
      if (objects[data.id]) {
        if (objects[data.id].body) {
          const b = objects[data.id].body;
          b.position.set(data.x, data.y, data.z);
          if (data.qx !== undefined) b.quaternion.set(data.qx, data.qy, data.qz, data.qw);
        } else {
          objects[data.id].mesh.position.set(data.x, data.z ? data.y : data.x, data.z);
        }
      }
    });

    // UI 제어
    const menuBtn = document.getElementById('menu-btn');
    const resetBtn = document.getElementById('reset-btn');
    const modeBtn = document.getElementById('mode-btn');
    const modal = document.getElementById('game-menu-modal');
    let isCameraMode = false;

    menuBtn.addEventListener('click', () => {
      modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    });

    function selectGame(gameType) {
      socket.emit('change-game', gameType);
      modal.style.display = 'none';
    }

    resetBtn.addEventListener('click', () => {
      socket.emit('reset-game');
    });

    modeBtn.addEventListener('click', () => {
      isCameraMode = !isCameraMode;
      controls.enableRotate = isCameraMode;
      modeBtn.textContent = isCameraMode ? "물체 이동 모드" : "카메라 회전 모드";
      if (isCameraMode) modeBtn.classList.add('camera-mode');
      else modeBtn.classList.remove('camera-mode');
    });

    // 드래그/터치 제어
    const raycaster = new THREE.Raycaster();
    const touchPos = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    let selectedObject = null;

    function updateTouchPos(e) {
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      touchPos.x = (x / window.innerWidth) * 2 - 1;
      touchPos.y = -(y / window.innerHeight) * 2 + 1;
    }

    window.addEventListener('pointerdown', (e) => {
      if (isCameraMode || e.target.closest('#ui-container') || e.target.closest('#game-menu-modal')) return;
      updateTouchPos(e);

      raycaster.setFromCamera(touchPos, camera);
      const meshes = Object.values(objects).map(o => o.mesh);
      const intersects = raycaster.intersectObjects(meshes);

      if (intersects.length > 0) {
        const hitMesh = intersects[0].object;
        selectedObject = objects[hitMesh.userData.id];
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!selectedObject || isCameraMode) return;
      updateTouchPos(e);

      if (selectedObject.body) {
        const forceVec = new CANNON.Vec3(touchPos.x * 2, 0, -touchPos.y * 2);
        selectedObject.body.applyImpulse(forceVec, selectedObject.body.position);

        const b = selectedObject.body;
        socket.emit('move-object', {
          id: selectedObject.mesh.userData.id,
          x: b.position.x, y: b.position.y, z: b.position.z,
          qx: b.quaternion.x, qy: b.quaternion.y, qz: b.quaternion.z, qw: b.quaternion.w
        });
      } else {
        raycaster.setFromCamera(touchPos, camera);
        const point = new THREE.Vector3();
        if (raycaster.ray.intersectPlane(dragPlane, point)) {
          selectedObject.mesh.position.x = point.x;
          selectedObject.mesh.position.z = point.z;
          socket.emit('move-object', {
            id: selectedObject.mesh.userData.id,
            x: point.x, y: selectedObject.mesh.position.y, z: point.z
          });
        }
      }
    });

    window.addEventListener('pointerup', () => { selectedObject = null; });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      world.step(1 / 60);

      Object.values(objects).forEach(obj => {
        if (obj.body) {
          obj.mesh.position.copy(obj.body.position);
          obj.mesh.quaternion.copy(obj.body.quaternion);
        }
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
