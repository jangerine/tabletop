<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile Web Tabletop Simulator</title>
  <style>
    * {
      touch-action: none; /* 모바일 터치 스크롤/새로고침 방지 */
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      overflow: hidden;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #ui-container {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    #info {
      color: white;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      backdrop-filter: blur(4px);
    }
    #mode-btn {
      pointer-events: auto;
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      cursor: pointer;
    }
    #mode-btn.camera-mode {
      background: #059669;
    }
  </style>
</head>
<body>
  <div id="ui-container">
    <div id="info">상태: 물체 이동 모드</div>
    <button id="mode-btn">카메라 회전 모드 전환</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const socket = io();

    // 1. Scene 및 카메라 설정
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111625); // 세련된 어두운 테마

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 14, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableRotate = false; // 기본: 물체 이동 모드
    controls.enablePan = false;

    // 2. 조명 설정
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(8, 20, 8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // 3. 🎨 동적 보드게임판 텍스처 생성 함수 (캔버스 이용)
    function createBoardTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const gridSize = 8;
      const tileSize = canvas.width / gridSize;

      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          ctx.fillStyle = (r + c) % 2 === 0 ? '#e2d5c3' : '#4a3525'; // 밝은 아이보리 / 클래식 나무색
          ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      return texture;
    }

    // 4. 🎲 보드게임 상판 & 테두리 제작
    const boardGroup = new THREE.Group();

    // 중앙 격자 게임판
    const boardGeo = new THREE.BoxGeometry(12, 0.2, 12);
    const boardMat = new THREE.MeshStandardMaterial({
      map: createBoardTexture(),
      roughness: 0.4
    });
    const boardMesh = new THREE.Mesh(boardGeo, boardMat);
    boardMesh.position.y = -0.1;
    boardMesh.receiveShadow = true;
    boardGroup.add(boardMesh);

    // 원목 테두리 프레임
    const frameGeo = new THREE.BoxGeometry(13.2, 0.3, 13.2);
    const frameMat = new THREE.MeshStandardMaterial({
      color: 0x2d1a0e, // 진한 나무색
      roughness: 0.6
    });
    const frameMesh = new THREE.Mesh(frameGeo, frameMat);
    frameMesh.position.y = -0.16;
    frameMesh.receiveShadow = true;
    boardGroup.add(frameMesh);

    scene.add(boardGroup);

    // 5. 게임 오브젝트 관리
    const objects = {};
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const raycaster = new THREE.Raycaster();
    const touchPos = new THREE.Vector2();
    let selectedObject = null;
    let isCameraMode = false;

    // UI 모드 토글 버튼
    const modeBtn = document.getElementById('mode-btn');
    const infoText = document.getElementById('info');

    modeBtn.addEventListener('click', () => {
      isCameraMode = !isCameraMode;
      controls.enableRotate = isCameraMode;
      
      if (isCameraMode) {
        modeBtn.textContent = "물체 이동 모드 전환";
        modeBtn.classList.add('camera-mode');
        infoText.textContent = "상태: 화면 회전 모드";
      } else {
        modeBtn.textContent = "카메라 회전 모드 전환";
        modeBtn.classList.remove('camera-mode');
        infoText.textContent = "상태: 물체 이동 모드";
      }
    });

    // 6. 다양한 보드게임 말/토큰 생성기 (큐브, 원기둥 말)
    function createPiece(id, type, x, y, z, color) {
      let geometry;
      if (type === 'token') {
        geometry = new THREE.CylinderGeometry(0.6, 0.6, 0.3, 32); // 동전/토큰 말
      } else {
        geometry = new THREE.BoxGeometry(1, 1, 1); // 주사위/큐브
      }

      const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.1 });
      const piece = new THREE.Mesh(geometry, material);
      piece.position.set(x, y, z);
      piece.castShadow = true;
      piece.receiveShadow = true;
      piece.userData = { id: id };
      
      scene.add(piece);
      objects[id] = piece;
    }

    // 서버 동기화 처리
    socket.on('init-state', (data) => {
      Object.values(data).forEach(obj => {
        if (!objects[obj.id]) {
          createPiece(obj.id, obj.type || 'cube', obj.x, obj.y, obj.z, obj.color);
        }
      });
    });

    socket.on('update-object', (data) => {
      if (objects[data.id]) {
        objects[data.id].position.x = data.x;
        objects[data.id].position.z = data.z;
      }
    });

    // 7. 터치/마우스 이동 제어
    function updateTouchPos(e) {
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      touchPos.x = (x / window.innerWidth) * 2 - 1;
      touchPos.y = -(y / window.innerHeight) * 2 + 1;
    }

    window.addEventListener('pointerdown', (e) => {
      if (isCameraMode) return;
      updateTouchPos(e);

      raycaster.setFromCamera(touchPos, camera);
      const intersects = raycaster.intersectObjects(Object.values(objects));

      if (intersects.length > 0) {
        selectedObject = intersects[0].object;
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!selectedObject || isCameraMode) return;
      updateTouchPos(e);

      raycaster.setFromCamera(touchPos, camera);
      const intersectionPoint = new THREE.Vector3();

      if (raycaster.ray.intersectPlane(dragPlane, intersectionPoint)) {
        selectedObject.position.x = intersectionPoint.x;
        selectedObject.position.z = intersectionPoint.z;

        socket.emit('move-object', {
          id: selectedObject.userData.id,
          x: selectedObject.position.x,
          z: selectedObject.position.z
        });
      }
    });

    window.addEventListener('pointerup', () => {
      selectedObject = null;
    });

    // 화면 크기 변경 감지
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 애니메이션 루프
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
