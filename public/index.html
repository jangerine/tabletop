<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tabletop Simulator Style Flying Card</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #1a1a1a;
      touch-action: none; /* 모바일 스크롤 및 바운스 방지 */
      user-select: none;
    }
    #info {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      font-family: sans-serif;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      pointer-events: none;
      text-align: center;
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="info">마우스/터치로 카드를 드래그해 보세요! (TTS 플라잉 효과)</div>

  <script>
    // 1. 씬, 카메라, 렌더러 설정
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x22242b);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, -6, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 2. 조명 설정
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, -5, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    // 3. 바닥 판 (Table Board)
    const boardGeo = new THREE.PlaneGeometry(12, 10);
    const boardMat = new THREE.MeshStandardMaterial({ color: 0x1e3a2b, roughness: 0.8 });
    const board = new THREE.Mesh(boardGeo, boardMat);
    board.receiveShadow = true;
    scene.add(board);

    // 4. 3D 카드 생성
    const cardGeo = new THREE.BoxGeometry(1.6, 2.4, 0.02);
    const cardMat = [
      new THREE.MeshStandardMaterial({ color: 0x333333 }), // 우
      new THREE.MeshStandardMaterial({ color: 0x333333 }), // 좌
      new THREE.MeshStandardMaterial({ color: 0x333333 }), // 상
      new THREE.MeshStandardMaterial({ color: 0x333333 }), // 하
      new THREE.MeshStandardMaterial({ color: 0xffffff }), // 앞면
      new THREE.MeshStandardMaterial({ color: 0xb22222 })  // 뒷면 (레드)
    ];
    const cardMesh = new THREE.Mesh(cardGeo, cardMat);
    cardMesh.castShadow = true;
    cardMesh.receiveShadow = true;
    scene.add(cardMesh);

    // 5. Flying Card 물리 제어 클래스
    class FlyingCardPhysics {
      constructor(mesh) {
        this.mesh = mesh;
        this.isDragging = false;
        
        this.pos = new THREE.Vector3(0, 0, 0.01);
        this.prevPos = new THREE.Vector2(0, 0);
        this.velocity = new THREE.Vector2(0, 0);
        this.rot = new THREE.Euler(0, 0, 0);

        this.targetZ = 0.01;
        this.isFlying = false;
        this.flyProgress = 0;
        this.flyDuration = 0.4;
        this.startPos = new THREE.Vector3();
        this.targetPos = new THREE.Vector3();
      }

      onDragStart(hitPoint) {
        this.isDragging = true;
        this.isFlying = false;
        this.targetZ = 1.2; // TTS 특유의 공중 들림 (Lift)
      }

      onDragMove(targetWorldPos) {
        if (!this.isDragging) return;

        // 드래그 속도 계산 (관성 기울임용)
        this.velocity.x = targetWorldPos.x - this.pos.x;
        this.velocity.y = targetWorldPos.y - this.pos.y;

        this.pos.x = targetWorldPos.x;
        this.pos.y = targetWorldPos.y;
      }

      onDragEnd(targetX = 0, targetY = 0, targetZ = 0.01) {
        this.isDragging = false;
        this.isFlying = true;
        this.flyProgress = 0;

        this.startPos.copy(this.pos);
        this.targetPos.set(targetX, targetY, targetZ);
      }

      update(delta) {
        // [A] 드래그 중: 공중 높이 보간 및 속도 기반 틸트(기울어짐)
        if (this.isDragging) {
          this.pos.z += (this.targetZ - this.pos.z) * 0.2;

          // 이동 속도에 비례해서 카드가 기울어짐 (TTS 관성 효과)
          const targetRotX = -this.velocity.y * 0.8;
          const targetRotY =  this.velocity.x * 0.8;
          const targetRotZ = -this.velocity.x * 0.3;

          this.rot.x += (targetRotX - this.rot.x) * 0.2;
          this.rot.y += (targetRotY - this.rot.y) * 0.2;
          this.rot.z += (targetRotZ - this.rot.z) * 0.2;

          this.velocity.multiplyScalar(0.7); // 속도 감쇄
        } 
        // [B] 손을 놓았을 때: 목표 지점으로 포물선을 그리며 비행
        else if (this.isFlying) {
          this.flyProgress += delta / this.flyDuration;
          if (this.flyProgress >= 1) {
            this.flyProgress = 1;
            this.isFlying = false;
          }

          const t = this.flyProgress;
          // Ease-Out-Cubic 감속 적용
          const easeT = 1 - Math.pow(1 - t, 3);

          this.pos.x = THREE.MathUtils.lerp(this.startPos.x, this.targetPos.x, easeT);
          this.pos.y = THREE.MathUtils.lerp(this.startPos.y, this.targetPos.y, easeT);

          // 비행 중 공중 포물선 (Z축 높이 peak)
          const arcHeight = Math.sin(t * Math.PI) * 1.0;
          this.pos.z = THREE.MathUtils.lerp(this.startPos.z, this.targetPos.z, easeT) + arcHeight;

          // 비행 중 회전 평평하게 복원
          this.rot.x += (0 - this.rot.x) * 0.2;
          this.rot.y += (0 - this.rot.y) * 0.2;
          this.rot.z += (0 - this.rot.z) * 0.2;
        }

        // Mesh 최종 반용
        this.mesh.position.copy(this.pos);
        this.mesh.rotation.copy(this.rot);
      }
    }

    const cardPhysics = new FlyingCardPhysics(cardMesh);

    // 6. 마우스/터치 레이캐스팅 및 인터랙션
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0); // Z축 직교 드래그 평면
    const planeIntersection = new THREE.Vector3();

    function getPointerPos(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;
    }

    function onPointerDown(e) {
      getPointerPos(e);
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(cardMesh);

      if (intersects.length > 0) {
        cardPhysics.onDragStart();
      }
    }

    function onPointerMove(e) {
      if (!cardPhysics.isDragging) return;
      getPointerPos(e);
      raycaster.setFromCamera(mouse, camera);

      // 드래그 평면과의 교차점 좌표 추출
      if (raycaster.ray.intersectPlane(dragPlane, planeIntersection)) {
        cardPhysics.onDragMove(planeIntersection);
      }
    }

    function onPointerUp() {
      if (cardPhysics.isDragging) {
        // 손을 놓으면 현재 위치 부근 또는 목표 지점으로 비행 착지
        cardPhysics.onDragEnd(cardPhysics.pos.x, cardPhysics.pos.y, 0.01);
      }
    }

    // 이벤트 리스너 등록 (PC/모바일 통합)
    window.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);

    // 창 크기 변경 대응
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 7. 메인 렌더 루프
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      // 카드 물리 및 비행 연출 갱신
      cardPhysics.update(delta);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
