<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Virtual Tabletop Simulator</title>
  <style>
    * { touch-action: none; user-select: none; box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #0f172a; font-family: sans-serif; }
    #ui-container {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; z-index: 10; pointer-events: none;
    }
    .btn {
      pointer-events: auto; background: #2563eb; color: white; border: none;
      padding: 10px 14px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-right: 4px;
    }
    #menu-modal {
      display: none; position: absolute; top: 60px; left: 12px;
      background: rgba(24, 24, 27, 0.95); padding: 16px; border-radius: 16px; z-index: 100; width: 200px;
    }
    .menu-item { display: block; width: 100%; padding: 10px; margin-bottom: 6px; background: #27272a; color: white; border: none; border-radius: 8px; cursor: pointer; text-align: left; }
    #hand-container {
      position: absolute; bottom: 12px; left: 0; right: 0; height: 120px;
      display: none; justify-content: center; align-items: flex-end; padding: 0 16px; overflow-x: auto; z-index: 20;
    }
    .card-ui {
      width: 60px; height: 90px; background: white; border-radius: 6px; margin: 0 -10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: inline-flex; flex-direction: column;
      justify-content: space-between; padding: 6px; font-weight: bold; cursor: grab; flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="ui-container">
    <div>
      <button class="btn" style="background:#8b5cf6;" onclick="toggleMenu()">🎮 게임 선택</button>
      <button class="btn" style="background:#dc2626;" onclick="socket.emit('reset-game')">💥 판 초기화</button>
    </div>
    <button id="mode-btn" class="btn" onclick="toggleCameraMode()">카메라 회전 모드</button>
  </div>

  <div id="menu-modal">
    <h3 style="color:white; margin:0 0 10px 0;">게임 목록</h3>
    <button class="menu-item" onclick="selectGame('jenga')">🪵 3D 젠가</button>
    <button class="menu-item" onclick="selectGame('classic')">♟️ 클래식 보드</button>
    <button class="menu-item" onclick="selectGame('onecard')">🃏 원카드</button>
  </div>

  <div id="hand-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const socket = io();

    // 1. Three.js 설정
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 12, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableRotate = false;

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const light = new THREE.DirectionalLight(0xffffff, 0.8);
    light.position.set(10, 20, 10);
    light.castShadow = true;
    scene.add(light);

    // 테이블 바닥
    const tableMesh = new THREE.Mesh(
      new THREE.BoxGeometry(14, 0.4, 14),
      new THREE.MeshStandardMaterial({ color: 0x1e293b })
    );
    tableMesh.position.y = -0.2;
    tableMesh.receiveShadow = true;
    scene.add(tableMesh);

    // 2. Cannon.js 물리 엔진
    const world = new CANNON.World();
    world.gravity.set(0, -9.82, 0);

    const tableBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(7, 0.2, 7)) });
    tableBody.position.set(0, -0.2, 0);
    world.addBody(tableBody);

    // 3. 게임 상태
    let currentGame = 'jenga';
    const objects = {};
    let selectedObj = null;

    function clearScene() {
      Object.keys(objects).forEach(id => {
        scene.remove(objects[id].mesh);
        if (objects[id].body) world.remove(objects[id].body);
        delete objects[id];
      });
    }

    function createObject(data) {
      let geo, shape, mass = 0.3;
      if (data.type === 'jenga_block') {
        geo = new THREE.BoxGeometry(3, 0.6, 1);
        shape = new CANNON.Box(new CANNON.Vec3(1.48, 0.29, 0.48));
      } else if (data.type === 'dice') {
        geo = new THREE.BoxGeometry(1, 1, 1);
        shape = new CANNON.Box(new CANNON.Vec3(0.5, 0.5, 0.5));
      } else {
        geo = new THREE.CylinderGeometry(0.6, 0.6, 0.3, 32);
        shape = new CANNON.Cylinder(0.6, 0.6, 0.3, 16);
      }

      const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: data.color }));
      mesh.castShadow = true;
      mesh.userData = { id: data.id };

      const body = new CANNON.Body({ mass, shape });
      body.position.set(data.x, data.y, data.z);
      if (data.rotY) body.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0), data.rotY);

      world.addBody(body);
      scene.add(mesh);
      objects[data.id] = { mesh, body };
    }

    // 소켓 동기화
    socket.on('init-game-mode', (data) => {
      currentGame = data.game;
      clearScene();
      document.getElementById('hand-container').style.display = currentGame === 'onecard' ? 'flex' : 'none';
    });

    socket.on('init-objects', (data) => {
      clearScene();
      Object.values(data).forEach(createObject);
    });

    socket.on('update-object', (data) => {
      if (objects[data.id]) {
        const b = objects[data.id].body;
        b.position.set(data.x, data.y, data.z);
        if (data.qx !== undefined) b.quaternion.set(data.qx, data.qy, data.qz, data.qw);
      }
    });

    socket.on('update-onecard-state', (data) => {
      const handContainer = document.getElementById('hand-container');
      handContainer.innerHTML = '';
      data.myHand.forEach(card => {
        const el = document.createElement('div');
        el.className = 'card-ui';
        el.style.color = card.color;
        el.innerHTML = `<div>${card.value}</div><div style="text-align:center;font-size:20px;">${card.suit}</div>`;
        el.onclick = () => socket.emit('play-card', card.id);
        handContainer.appendChild(el);
      });
    });

    // 4. 모바일/PC 통합 Raycasting 드래그
    const raycaster = new THREE.Raycaster();
    const touchPos = new THREE.Vector2();
    let lastTouchPos = new THREE.Vector2();

    function updateTouchPos(e) {
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      touchPos.x = (x / window.innerWidth) * 2 - 1;
      touchPos.y = -(y / window.innerHeight) * 2 + 1;
    }

    window.addEventListener('pointerdown', (e) => {
      if (isCameraMode || e.target.closest('#ui-container') || e.target.closest('#hand-container')) return;
      updateTouchPos(e);
      lastTouchPos.copy(touchPos);

      raycaster.setFromCamera(touchPos, camera);
      const meshes = Object.values(objects).map(o => o.mesh);
      const intersects = raycaster.intersectObjects(meshes);

      if (intersects.length > 0) {
        selectedObj = objects[intersects[0].object.userData.id];
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!selectedObj || isCameraMode) return;
      updateTouchPos(e);

      const dx = (touchPos.x - lastTouchPos.x) * 10;
      const dy = (touchPos.y - lastTouchPos.y) * 10;
      selectedObj.body.applyImpulse(new CANNON.Vec3(dx, 0, -dy), selectedObj.body.position);

      const b = selectedObj.body;
      socket.emit('move-object', {
        id: selectedObj.mesh.userData.id,
        x: b.position.x, y: b.position.y, z: b.position.z,
        qx: b.quaternion.x, qy: b.quaternion.y, qz: b.quaternion.z, qw: b.quaternion.w
      });

      lastTouchPos.copy(touchPos);
    });

    window.addEventListener('pointerup', () => { selectedObj = null; });

    // UI 모드 조작
    let isCameraMode = false;
    function toggleCameraMode() {
      isCameraMode = !isCameraMode;
      controls.enableRotate = isCameraMode;
      const btn = document.getElementById('mode-btn');
      btn.textContent = isCameraMode ? "물체 이동 모드" : "카메라 회전 모드";
      btn.style.background = isCameraMode ? "#059669" : "#2563eb";
    }

    function toggleMenu() {
      const m = document.getElementById('menu-modal');
      m.style.display = m.style.display === 'block' ? 'none' : 'block';
    }

    function selectGame(game) {
      socket.emit('change-game', game);
      toggleMenu();
    }

    // 5. 애니메이션 루프
    function animate() {
      requestAnimationFrame(animate);
      if (currentGame !== 'onecard') {
        world.step(1 / 60);
        Object.values(objects).forEach(obj => {
          if (obj.body) {
            obj.mesh.position.copy(obj.body.position);
            obj.mesh.quaternion.copy(obj.body.quaternion);
          }
        });
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
